name: Deploy

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  # `gh run list` in the check-ci job reads the Actions API — without
  # `actions: read` the token is rejected with "Resource not accessible".
  actions: read

env:
  PNPM_VERSION: '11.24.0'
  STELLAR_CLI_VERSION: '27.1.0'

jobs:
  check-ci:
    name: Verify CI Passed
    runs-on: ubuntu-latest
    steps:
      - name: Check latest CI run on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONCLUSION=$(gh run list --workflow CI --branch main --limit 1 --json conclusion --jq '.[0].conclusion')
          if [ "$CONCLUSION" != "success" ]; then
            echo "Latest CI run on main: $CONCLUSION — aborting deploy"
            exit 1
          fi
          echo "CI passed on main, proceeding with deploy"

  docker:
    needs: [check-ci]
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Node version from .nvmrc
        id: nvm
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build & push gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.gateway
          push: true
          tags: |
            x402/gateway:latest
            x402/gateway:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push dashboard
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.dashboard
          push: true
          tags: |
            x402/dashboard:latest
            x402/dashboard:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sbom:
    needs: [check-ci]
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload SBOM as a release asset
    steps:
      - uses: actions/checkout@v4

      - name: Read Node version from .nvmrc
        id: nvm
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvm.outputs.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # CycloneDX SBOM covering the JS workspace (pnpm-lock.yaml) and the
      # Rust contracts (Cargo.lock). Attached to the release automatically.
      - name: Generate SBOM (CycloneDX JSON)
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: cyclonedx-json
          output-file: x402-gateway-sbom.cdx.json

      - name: Attach SBOM to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" x402-gateway-sbom.cdx.json --clobber

  deploy_contracts:
    needs: [check-ci]
    name: Deploy & Initialize Soroban Contracts
    runs-on: ubuntu-latest
    # The job commits the freshly deployed contract IDs back to main so the
    # repo's contracts/deployed-addresses.json always reflects the live
    # instances. Requires contents: write for the commit-back step.
    permissions:
      contents: write
    # secrets is not available in step-level `if:`; bridge it via job env so
    # the commit-back step only runs when a deploy actually happened.
    env:
      HAS_STELLAR_SECRET: ${{ secrets.STELLAR_SECRET_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/*/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/**/Cargo.toml') }}

      - name: Download Stellar CLI (pre-built)
        run: |
          curl -sL -o /tmp/stellar.tar.gz \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/stellar.tar.gz -C /tmp
          chmod +x /tmp/stellar
          sudo mv /tmp/stellar /usr/local/bin/stellar
          stellar --version

      # Builds → deploys → initializes every contract (init admin/asset/
      # threshold args are contract-specific) → writes the new IDs to
      # contracts/deployed-addresses.json. Skips gracefully when
      # STELLAR_SECRET_KEY is not set.
      - name: Deploy & initialize contracts
        run: bash scripts/deploy-contracts.sh
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_SECRET_KEY }}
          STELLAR_NETWORK: testnet
          # Optional overrides:
          # STELLAR_RPC_URL: https://soroban-testnet.stellar.org
          # STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
          # USDC_ISSUER: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
          # MULTISIG_SIGNERS: GABC...,GDEF...   (defaults to the admin key)
          # MULTISIG_THRESHOLD: 2               (default 1)

      # Persist the freshly deployed addresses to the repository so the next
      # gateway build starts from the new contract IDs instead of stale
      # hardcoded defaults. [skip ci] avoids re-triggering CI on the commit.
      #
      # The script above already modified contracts/deployed-addresses.json in
      # the working tree, so copy it aside, switch to latest main, then put it
      # back — this avoids "local changes would be overwritten by checkout"
      # when main has advanced past the tag that triggered this workflow.
      - name: Commit deployed addresses back to main
        if: env.HAS_STELLAR_SECRET == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          cp contracts/deployed-addresses.json /tmp/deployed-addresses.json
          # -f guarantees the switch succeeds even though the addresses file
          # is modified in the working tree; we restore it from /tmp below.
          git checkout -f -B deploy-contracts origin/main
          cp /tmp/deployed-addresses.json contracts/deployed-addresses.json
          git add contracts/deployed-addresses.json
          if git diff --cached --quiet; then
            echo "No address changes to commit — deployed IDs match the repo."
          else
            git commit -m "chore(contracts): persist deployed contract addresses [skip ci]"
            git push origin deploy-contracts:main
          fi
